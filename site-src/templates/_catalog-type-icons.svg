<style>
  /* Catalog-type pictograms — shared by the landing section and catalog-types.svg (see scripts/generate-site.ts {{@typeIcons}}). */
  .ct-ic { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ct-ic .ct-dot { fill: var(--link); stroke: none; }
  .ct-ic .ct-soft { fill: var(--muted); stroke: none; opacity: .3; }
  .ct-ic .ct-faint { opacity: .45; }
  .ct-ic .ct-ok { stroke: var(--yes); }
  .ct-ic .ct-bad { stroke: var(--no); }
  .ct-badge { fill: var(--yes); }
  .ct-badge-plus { fill: none; stroke: var(--bg); stroke-width: 2; stroke-linecap: round; }
</style>
