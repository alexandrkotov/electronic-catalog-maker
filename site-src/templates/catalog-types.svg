<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 918" role="img" aria-labelledby="title">
<!-- GENERATED by scripts/generate-site.ts from site-src/templates/catalog-types.svg — edit the template, not this file. -->
<title id="title">{{types.alt}}</title>
<script><![CDATA[
  // Opened from the landing page (same origin), follow the theme picked there —
  // same localStorage key as the landing, editor and viewer. Scripts don't run
  // when the SVG is shown as an <img> (the repo README), which keeps the OS theme.
  try {
    var t = localStorage.getItem("ecm-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
]]></script>
<style>
  :root {
    color-scheme: light;
    --bg: #fff; --text: #1a1a1a; --muted: #666; --border: #d0d5dd; --card: #fff; --frame: #f8fafc;
    --link: #2563eb; --yes: #16a34a; --no: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14161b; --text: #e5e7eb; --muted: #9aa1ac; --border: #3a3f4b; --card: #1c1f26; --frame: #181b21;
      --link: #60a5fa; --yes: #4ade80; --no: #f87171;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161b; --text: #e5e7eb; --muted: #9aa1ac; --border: #3a3f4b; --card: #1c1f26; --frame: #181b21;
    --link: #60a5fa; --yes: #4ade80; --no: #f87171;
  }
  /* Paints the browser window around the picture too when the SVG is opened on its own. */
  :root { background: var(--bg); }
  /* Named fonts before system-ui: on Linux system-ui is often the much wider DejaVu Sans, which would overflow the labels. */
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", "Liberation Sans", Arial, system-ui, sans-serif; }
  .page { fill: var(--bg); }
  .h { fill: var(--text); font-size: 22px; font-weight: 700; }
  .domain { fill: var(--muted); font-size: 15px; }
  .domain-link, .demo-link { cursor: pointer; }
  .domain-link:hover .domain { fill: var(--link); text-decoration: underline; }
  .demo-link:hover .demo { text-decoration: underline; }
  .band { fill: var(--frame); stroke: var(--border); stroke-width: 1; }
  .card { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
  .num { fill: var(--link); }
  .num-t { fill: var(--bg); font-size: 15px; font-weight: 700; }
  .lvl { fill: var(--text); font-size: 17px; font-weight: 700; }
  .t { fill: var(--text); font-size: 13px; font-weight: 600; }
  .s { fill: var(--muted); font-size: 13px; }
  .demo { fill: var(--link); font-size: 14px; font-weight: 600; }
  .plus-t { fill: var(--muted); font-size: 18px; }
</style>
