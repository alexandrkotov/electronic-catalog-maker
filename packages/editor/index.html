<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electronic Catalog — Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- Privacy-friendly, cookie-free page-view counting (goatcounter.com) —
         same account as the landing page and viewer, so the dashboard shows
         editor vs. viewer usage separately. count.js skips localhost/private
         IPs by default (no allow_local set), so local dev doesn't pollute
         the real counts — nothing to gate on the production build. -->
    <script data-goatcounter="https://ecatm.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
