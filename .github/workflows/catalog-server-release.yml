name: Release catalog-server (Snap Store + GitHub Release)

# Manual only, on purpose — same philosophy as collab-server's release
# process (see feedback-collab-server-binary-release-process in project
# memory): rebuilding/republishing binaries is a deliberate, occasional
# action, not something that should fire on every push.
#
# No GitLab disaster-recovery backup yet, unlike collab-server — that was
# added well after collab-server's base release had already been live for a
# while; worth doing the same here once this one has some real mileage too.
on:
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel to release to"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - candidate
          - beta
          - edge
      publish_snap:
        description: "Also publish to the Snap Store (uncheck to only refresh the GitHub Release binaries). First run needs `ecm-catalog-server` registered on the Snap Store first — see this package's README."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-linux-x64
          path: packages/catalog-server/dist/ecm-catalog-server-linux-x64
          if-no-files-found: error

  build-windows:
    name: Build Windows binary (cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-windows-x64.exe
          path: packages/catalog-server/dist/ecm-catalog-server-windows-x64.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS binary (Apple Silicon, cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:macos-arm64
      # See collab-server-release.yml's matching step for why this needs to
      # be a zip, not the raw binary — GitHub Release assets lose the
      # executable bit otherwise, and a zip's central directory preserves it.
      - name: Zip (preserves the executable bit through the Release download)
        working-directory: packages/catalog-server/dist
        run: |
          chmod +x ecm-catalog-server-macos-arm64
          zip -j ecm-catalog-server-macos-arm64.zip ecm-catalog-server-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-macos-arm64
          path: packages/catalog-server/dist/ecm-catalog-server-macos-arm64.zip
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS binary (Intel, cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:macos-x64
      - name: Zip (preserves the executable bit through the Release download)
        working-directory: packages/catalog-server/dist
        run: |
          chmod +x ecm-catalog-server-macos-x64
          zip -j ecm-catalog-server-macos-x64.zip ecm-catalog-server-macos-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-macos-x64
          path: packages/catalog-server/dist/ecm-catalog-server-macos-x64.zip
          if-no-files-found: error

  # Real Apple hardware, hosted by GitHub — see collab-server-release.yml's
  # matching job for the full "why" (Apple's license, this project's own
  # Mac being too old to run Bun's compile output at all).
  smoke-test-macos-arm64:
    name: Smoke-test macOS binary (Apple Silicon, real hardware)
    needs: [build-macos-arm64]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-macos-arm64
          path: dist
      - name: Unpack
        working-directory: dist
        run: |
          unzip ecm-catalog-server-macos-arm64.zip
          chmod +x ecm-catalog-server-macos-arm64
      - name: Run it and confirm the status endpoint answers
        working-directory: dist
        run: |
          ./ecm-catalog-server-macos-arm64 &
          SERVER_PID=$!
          ok=false
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8899/status.json -o status.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 1
          done
          echo "--- /status.json ---"
          cat status.json 2>/dev/null || echo "(no response)"
          if [ "$ok" != true ] || ! grep -q '"port"' status.json; then
            echo "The server never answered /status.json with the expected shape" >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8899/shutdown || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Smoke test passed: started, served /status.json, shut down cleanly."

  build-deb:
    name: Package Linux binary as .deb (Chromebook/Crostini, Debian, Ubuntu)
    needs: [build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-linux-x64
          path: dist

      - name: Read catalog-server version
        id: version
        run: echo "version=$(node -p "require('./packages/catalog-server/package.json').version")" >> "$GITHUB_OUTPUT"

      # Same structure as collab-server-release.yml's build-deb — see its
      # comment for the full "why" (Crostini install-by-double-click, no
      # systemd unit / auto-start).
      - name: Build .deb package
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          PKGROOT=pkgroot
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/pixmaps"

          install -m 755 dist/ecm-catalog-server-linux-x64 "$PKGROOT/usr/bin/ecm-catalog-server"
          install -m 644 packages/catalog-server/assets/icons/icon-512.png "$PKGROOT/usr/share/pixmaps/ecm-catalog-server.png"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=ECM Catalog Server' \
            'Comment=Share a folder of Electronic Catalog Maker catalogs from your computer' \
            'Exec=/usr/bin/ecm-catalog-server' \
            'Icon=/usr/share/pixmaps/ecm-catalog-server.png' \
            'Terminal=false' \
            'Categories=Network;Utility;' \
            > "$PKGROOT/usr/share/applications/ecm-catalog-server.desktop"

          printf '%s\n' \
            'Package: ecm-catalog-server' \
            "Version: $VERSION" \
            'Section: net' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: Alexander Kotov <alexandrkotov@users.noreply.github.com>' \
            'Homepage: https://tapalog.com/' \
            'Description: Share a folder of Electronic Catalog Maker catalogs from your computer' \
            ' Runs a small local server that shares a folder of Electronic Catalog' \
            ' Maker (.ecatm) catalog files with anyone who visits its address, on' \
            ' your local network or over the internet (via a temporary Cloudflare' \
            ' Quick Tunnel). Launch it from the Linux apps menu; stop it again from' \
            ' its own browser status page.' \
            > "$PKGROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKGROOT" ecm-catalog-server-amd64.deb

      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-amd64.deb
          path: ecm-catalog-server-amd64.deb
          if-no-files-found: error

  smoke-test-deb:
    name: Smoke-test the .deb (install, run, remove)
    needs: [build-deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-amd64.deb
          path: dist

      - name: Install via dpkg
        run: sudo dpkg -i dist/ecm-catalog-server-amd64.deb

      - name: Confirm the files landed where the .desktop entry expects
        run: |
          test -x /usr/bin/ecm-catalog-server
          test -f /usr/share/applications/ecm-catalog-server.desktop
          test -f /usr/share/pixmaps/ecm-catalog-server.png
          grep -q '^Exec=/usr/bin/ecm-catalog-server$' /usr/share/applications/ecm-catalog-server.desktop

      - name: Run it and confirm the status endpoint answers
        run: |
          ecm-catalog-server &
          SERVER_PID=$!
          ok=false
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8899/status.json -o status.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 1
          done
          echo "--- /status.json ---"
          cat status.json 2>/dev/null || echo "(no response)"
          if [ "$ok" != true ] || ! grep -q '"port"' status.json; then
            echo "The server never answered /status.json with the expected shape" >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8899/shutdown || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Smoke test passed: installed via dpkg, started, served /status.json, shut down cleanly."

      - name: Remove cleanly via dpkg
        run: |
          sudo dpkg -r ecm-catalog-server
          test ! -e /usr/bin/ecm-catalog-server
          test ! -e /usr/share/applications/ecm-catalog-server.desktop

  publish-snap:
    name: Build + publish Snap (Snap Store / Ubuntu App Center)
    if: ${{ github.event.inputs.publish_snap == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: packages/catalog-server

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.event.inputs.snap_channel }}

  github-release:
    name: Update the catalog-server-latest GitHub Release
    needs: [build-linux, build-windows, smoke-test-macos-arm64, build-macos-x64, smoke-test-deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-linux-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-windows-x64.exe
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-macos-arm64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-macos-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-amd64.deb
          path: dist

      - name: Read catalog-server version
        id: version
        run: echo "version=$(node -p "require('./packages/catalog-server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Move the rolling catalog-server-latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f catalog-server-latest
          git push origin catalog-server-latest --force

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: catalog-server-latest
          name: "catalog-server v${{ steps.version.outputs.version }}"
          body: |
            Shares a folder of Electronic Catalog Maker (.ecatm) catalog files from your own computer, over your local network or (optionally) the internet — no upload to any hosting service.

            - `ecm-catalog-server-windows-x64.exe` — Windows, portable, no installer
            - `ecm-catalog-server-linux-x64` — Linux, portable, no installer
            - `ecm-catalog-server-amd64.deb` — Debian/Ubuntu/Chromebook (Linux/Crostini), installable package
            - `ecm-catalog-server-macos-arm64.zip` — macOS, Apple Silicon, portable, no installer
            - `ecm-catalog-server-macos-x64.zip` — macOS, Intel, portable, no installer

            Ubuntu users can instead install from the
            [Snap Store](https://snapcraft.io/ecm-catalog-server) (`sudo snap install ecm-catalog-server`), once published there.

            On a Chromebook, [turn on Linux (Crostini)](https://support.google.com/chromebook/answer/9145439?hl=en) once in Settings, then download the `.deb` file and double-click it in the Files app — ChromeOS offers to install it, and afterward it shows up as "ECM Catalog Server" in the Linux apps folder of your app launcher.

            None of these are code-signed. Windows will show a SmartScreen warning on first run ("More info" → "Run anyway").

            The macOS download is a zip (unzipping restores the file's execute permission, which a direct download can't carry) — after unzipping, macOS will refuse to run it at all ("is damaged and can't be opened") because it's fully unsigned; open Terminal in the folder you unzipped it to and run:
            `xattr -d com.apple.quarantine ecm-catalog-server-macos-* && chmod +x ecm-catalog-server-macos-* && ./ecm-catalog-server-macos-*`
            (replace the `*` with your actual filename) — also requires **macOS 13 (Ventura) or later**.

            See [packages/catalog-server](https://github.com/alexandrkotov/electronic-catalog-maker/tree/main/packages/catalog-server) for details.
          files: |
            dist/ecm-catalog-server-linux-x64
            dist/ecm-catalog-server-windows-x64.exe
            dist/ecm-catalog-server-amd64.deb
            dist/ecm-catalog-server-macos-arm64.zip
            dist/ecm-catalog-server-macos-x64.zip
