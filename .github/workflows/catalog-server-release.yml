name: Release catalog-server (GitHub Release)

# Manual only, on purpose — same philosophy as collab-server's release
# process (see feedback-collab-server-binary-release-process in project
# memory): rebuilding/republishing binaries is a deliberate, occasional
# action, not something that should fire on every push.
#
# Deliberately trimmed compared to collab-server-release.yml for this first
# version: no .deb/Snap Store packaging, no GitLab disaster-recovery backup
# yet — those were added to collab-server iteratively after its base release
# was live and confirmed working; same path planned here, not done upfront.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-linux-x64
          path: packages/catalog-server/dist/ecm-catalog-server-linux-x64
          if-no-files-found: error

  build-windows:
    name: Build Windows binary (cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-windows-x64.exe
          path: packages/catalog-server/dist/ecm-catalog-server-windows-x64.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS binary (Apple Silicon, cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:macos-arm64
      # See collab-server-release.yml's matching step for why this needs to
      # be a zip, not the raw binary — GitHub Release assets lose the
      # executable bit otherwise, and a zip's central directory preserves it.
      - name: Zip (preserves the executable bit through the Release download)
        working-directory: packages/catalog-server/dist
        run: |
          chmod +x ecm-catalog-server-macos-arm64
          zip -j ecm-catalog-server-macos-arm64.zip ecm-catalog-server-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-macos-arm64
          path: packages/catalog-server/dist/ecm-catalog-server-macos-arm64.zip
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS binary (Intel, cross-compiled)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/catalog-server
        run: bun run compile:macos-x64
      - name: Zip (preserves the executable bit through the Release download)
        working-directory: packages/catalog-server/dist
        run: |
          chmod +x ecm-catalog-server-macos-x64
          zip -j ecm-catalog-server-macos-x64.zip ecm-catalog-server-macos-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-catalog-server-macos-x64
          path: packages/catalog-server/dist/ecm-catalog-server-macos-x64.zip
          if-no-files-found: error

  # Real Apple hardware, hosted by GitHub — see collab-server-release.yml's
  # matching job for the full "why" (Apple's license, this project's own
  # Mac being too old to run Bun's compile output at all).
  smoke-test-macos-arm64:
    name: Smoke-test macOS binary (Apple Silicon, real hardware)
    needs: [build-macos-arm64]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-macos-arm64
          path: dist
      - name: Unpack
        working-directory: dist
        run: |
          unzip ecm-catalog-server-macos-arm64.zip
          chmod +x ecm-catalog-server-macos-arm64
      - name: Run it and confirm the status endpoint answers
        working-directory: dist
        run: |
          ./ecm-catalog-server-macos-arm64 &
          SERVER_PID=$!
          ok=false
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8899/status.json -o status.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 1
          done
          echo "--- /status.json ---"
          cat status.json 2>/dev/null || echo "(no response)"
          if [ "$ok" != true ] || ! grep -q '"port"' status.json; then
            echo "The server never answered /status.json with the expected shape" >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8899/shutdown || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Smoke test passed: started, served /status.json, shut down cleanly."

  github-release:
    name: Update the catalog-server-latest GitHub Release
    needs: [build-linux, build-windows, smoke-test-macos-arm64, build-macos-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-linux-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-windows-x64.exe
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-macos-arm64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-catalog-server-macos-x64
          path: dist

      - name: Read catalog-server version
        id: version
        run: echo "version=$(node -p "require('./packages/catalog-server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Move the rolling catalog-server-latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f catalog-server-latest
          git push origin catalog-server-latest --force

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: catalog-server-latest
          name: "catalog-server v${{ steps.version.outputs.version }}"
          body: |
            Shares a folder of Electronic Catalog Maker (.ecatm) catalog files from your own computer, over your local network or (optionally) the internet — no upload to any hosting service.

            - `ecm-catalog-server-windows-x64.exe` — Windows, portable, no installer
            - `ecm-catalog-server-linux-x64` — Linux, portable, no installer
            - `ecm-catalog-server-macos-arm64.zip` — macOS, Apple Silicon, portable, no installer
            - `ecm-catalog-server-macos-x64.zip` — macOS, Intel, portable, no installer

            None of these are code-signed. Windows will show a SmartScreen warning on first run ("More info" → "Run anyway").

            The macOS download is a zip (unzipping restores the file's execute permission, which a direct download can't carry) — after unzipping, macOS will refuse to run it at all ("is damaged and can't be opened") because it's fully unsigned; open Terminal in the folder you unzipped it to and run:
            `xattr -d com.apple.quarantine ecm-catalog-server-macos-* && chmod +x ecm-catalog-server-macos-* && ./ecm-catalog-server-macos-*`
            (replace the `*` with your actual filename) — also requires **macOS 13 (Ventura) or later**.

            See [packages/catalog-server](https://github.com/alexandrkotov/electronic-catalog-maker/tree/main/packages/catalog-server) for details.
          files: |
            dist/ecm-catalog-server-linux-x64
            dist/ecm-catalog-server-windows-x64.exe
            dist/ecm-catalog-server-macos-arm64.zip
            dist/ecm-catalog-server-macos-x64.zip
