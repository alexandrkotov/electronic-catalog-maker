name: Release collab-server (Snap Store + GitHub Release)

# Manual only, on purpose — same philosophy as the rest of collab-server's
# release process (see feedback-collab-server-binary-release-process in
# project memory): rebuilding/republishing binaries is a deliberate,
# occasional action, not something that should fire on every push.
on:
  workflow_dispatch:
    inputs:
      snap_channel:
        description: "Snap Store channel to release to"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - candidate
          - beta
          - edge
      publish_snap:
        description: "Also publish to the Snap Store (uncheck to only refresh the GitHub Release binaries)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/collab-server
        run: bun run compile:linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-collab-server-linux-x64
          path: packages/collab-server/dist/ecm-collab-server-linux-x64
          if-no-files-found: error

  build-windows:
    name: Build Windows binary (cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/collab-server
        run: bun run compile:windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-collab-server-windows-x64.exe
          path: packages/collab-server/dist/ecm-collab-server-windows-x64.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS binary (Apple Silicon, cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/collab-server
        run: bun run compile:macos-arm64
      # GitHub Release assets are plain blobs with no unix-permission
      # metadata: whatever downloads a raw executable from a Release gets
      # it back without the execute bit, which on macOS means Finder can't
      # recognize it as a program at all (confirmed live: double-clicking
      # opened the raw binary as garbled text in TextEdit instead of
      # running it). A zip's central directory *does* store unix file
      # modes, and both macOS's built-in Archive Utility and `unzip`
      # restore them on extract — so zip here, not just at download time.
      - name: Zip (preserves the executable bit through the Release download)
        working-directory: packages/collab-server/dist
        run: |
          chmod +x ecm-collab-server-macos-arm64
          zip -j ecm-collab-server-macos-arm64.zip ecm-collab-server-macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-collab-server-macos-arm64
          path: packages/collab-server/dist/ecm-collab-server-macos-arm64.zip
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS binary (Intel, cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Compile
        working-directory: packages/collab-server
        run: bun run compile:macos-x64
      # See build-macos-arm64's comment above — same reason.
      - name: Zip (preserves the executable bit through the Release download)
        working-directory: packages/collab-server/dist
        run: |
          chmod +x ecm-collab-server-macos-x64
          zip -j ecm-collab-server-macos-x64.zip ecm-collab-server-macos-x64
      - uses: actions/upload-artifact@v7
        with:
          name: ecm-collab-server-macos-x64
          path: packages/collab-server/dist/ecm-collab-server-macos-x64.zip
          if-no-files-found: error

  # Real Apple hardware, hosted by GitHub (macos-14/macos-13 runner images
  # are Apple Silicon / Intel respectively) — the only *free*, legal way to
  # actually run a macOS binary end to end: Apple's license only permits
  # virtualizing macOS on Apple hardware, so a local emulator/VM on
  # non-Apple hardware wasn't an option, and this project's own real Mac
  # (a 2012 MacBook Pro stuck on Catalina) can't run these binaries at all
  # — Bun's compile output requires macOS 13+ (confirmed live: a
  # `_preadv$NOCANCEL` dyld symbol genuinely doesn't exist before that).
  smoke-test-macos-arm64:
    name: Smoke-test macOS binary (Apple Silicon, real hardware)
    needs: [build-macos-arm64]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-macos-arm64
          path: dist
      - name: Unpack
        working-directory: dist
        run: |
          unzip ecm-collab-server-macos-arm64.zip
          chmod +x ecm-collab-server-macos-arm64
      # No Gatekeeper/quarantine dance needed here — that only applies to
      # files a browser (or curl with the right flags) marked as
      # downloaded-from-the-internet; a file this same runner just built
      # and unzipped itself was never quarantined in the first place. This
      # step is purely about whether the binary itself runs and serves
      # correctly on real, current macOS — not about the separate
      # distribution-side Gatekeeper friction end users hit (documented in
      # the release notes below).
      - name: Run it and confirm the status endpoint answers
        working-directory: dist
        run: |
          ./ecm-collab-server-macos-arm64 &
          SERVER_PID=$!
          ok=false
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8787/status.json -o status.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 1
          done
          echo "--- /status.json ---"
          cat status.json 2>/dev/null || echo "(no response)"
          if [ "$ok" != true ] || ! grep -q '"port"' status.json; then
            echo "The server never answered /status.json with the expected shape" >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8787/shutdown || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Smoke test passed: started, served /status.json, shut down cleanly."

  # No Intel equivalent of smoke-test-macos-arm64: GitHub's macos-13
  # (Intel) runner pool is being wound down and queued noticeably longer
  # than macos-14's Apple Silicon pool (confirmed live, 2026-09-13 — over
  # 4 minutes still waiting for a runner while arm64 had already finished).
  # The x64 binary is still built and shipped below, just without its own
  # live run on real hardware — build-macos-arm64's smoke test already
  # confirms the shared mechanism (Bun compile + embedded cloudflared +
  # /status.json) works; the x64 target differs only in CPU architecture,
  # not in any of that logic.

  build-deb:
    name: Package Linux binary as .deb (Chromebook/Crostini, Debian, Ubuntu)
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-linux-x64
          path: dist

      - name: Read collab-server version
        id: version
        run: echo "version=$(node -p "require('./packages/collab-server/package.json').version")" >> "$GITHUB_OUTPUT"

      # Wraps the exact same linux-x64 binary build-linux already produces
      # with a .desktop launcher and an icon, so ChromeOS's Crostini
      # container (Debian-based) — and any other Debian/Ubuntu box — can
      # install it with a double-click in the Files app instead of the
      # terminal chmod+x/run dance. Deliberately no systemd unit / install
      # hook to auto-start it: like every other platform build, this stays
      # a manually-launched app that you stop again from its own browser
      # status page, not a background daemon.
      - name: Build .deb package
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          PKGROOT=pkgroot
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/bin" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/share/pixmaps"

          install -m 755 dist/ecm-collab-server-linux-x64 "$PKGROOT/usr/bin/ecm-collab-server"
          install -m 644 packages/collab-server/assets/icons/icon-512.png "$PKGROOT/usr/share/pixmaps/ecm-collab-server.png"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=ECM Collaboration Server' \
            'Comment=Self-hosted real-time collaboration server for Electronic Catalog Maker' \
            'Exec=/usr/bin/ecm-collab-server' \
            'Icon=/usr/share/pixmaps/ecm-collab-server.png' \
            'Terminal=false' \
            'Categories=Network;Utility;' \
            > "$PKGROOT/usr/share/applications/ecm-collab-server.desktop"

          printf '%s\n' \
            'Package: ecm-collab-server' \
            "Version: $VERSION" \
            'Section: net' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: Alexander Kotov <alexandrkotov@users.noreply.github.com>' \
            'Homepage: https://alexandrkotov.github.io/electronic-catalog-maker/' \
            'Description: Self-hosted real-time collaboration server for Electronic Catalog Maker' \
            ' Runs a small local server that lets several people edit the same' \
            ' Electronic Catalog Maker (.ecatm) catalog file at the same time,' \
            ' live. Exposes a local address plus a public one (via a temporary' \
            ' Cloudflare Quick Tunnel) so collaborators anywhere can join, no' \
            ' router setup or account needed. Launch it from the Linux apps' \
            ' menu; stop it again from its own browser status page.' \
            > "$PKGROOT/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKGROOT" ecm-collab-server-amd64.deb

      - uses: actions/upload-artifact@v7
        with:
          name: ecm-collab-server-amd64.deb
          path: ecm-collab-server-amd64.deb
          if-no-files-found: error

  # There's no "real hardware" wrinkle here the way there is for macOS
  # (that one exists purely because Apple's license restricts virtualizing
  # macOS to Apple hardware) — ubuntu-latest already *is* a genuine amd64
  # Debian/Ubuntu machine, and GitHub has no ChromeOS/Crostini runner image
  # to test on regardless. What's worth verifying instead is that the
  # package itself behaves correctly under dpkg: installs to the paths the
  # .desktop file expects, the extracted binary actually runs and serves
  # the same /status.json contract as every other build, and it uninstalls
  # cleanly — the same mechanism Crostini's package manager uses.
  smoke-test-deb:
    name: Smoke-test the .deb (install, run, remove)
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-amd64.deb
          path: dist

      - name: Install via dpkg
        run: sudo dpkg -i dist/ecm-collab-server-amd64.deb

      - name: Confirm the files landed where the .desktop entry expects
        run: |
          test -x /usr/bin/ecm-collab-server
          test -f /usr/share/applications/ecm-collab-server.desktop
          test -f /usr/share/pixmaps/ecm-collab-server.png
          grep -q '^Exec=/usr/bin/ecm-collab-server$' /usr/share/applications/ecm-collab-server.desktop

      - name: Run it and confirm the status endpoint answers
        run: |
          ecm-collab-server &
          SERVER_PID=$!
          ok=false
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8787/status.json -o status.json 2>/dev/null; then
              ok=true
              break
            fi
            sleep 1
          done
          echo "--- /status.json ---"
          cat status.json 2>/dev/null || echo "(no response)"
          if [ "$ok" != true ] || ! grep -q '"port"' status.json; then
            echo "The server never answered /status.json with the expected shape" >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -X POST http://localhost:8787/shutdown || true
          wait "$SERVER_PID" 2>/dev/null || true
          echo "Smoke test passed: installed via dpkg, started, served /status.json, shut down cleanly."

      - name: Remove cleanly via dpkg
        run: |
          sudo dpkg -r ecm-collab-server
          test ! -e /usr/bin/ecm-collab-server
          test ! -e /usr/share/applications/ecm-collab-server.desktop

  publish-snap:
    name: Build + publish Snap (Snap Store / Ubuntu App Center)
    if: ${{ github.event.inputs.publish_snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.event.inputs.snap_channel }}

  github-release:
    name: Update the collab-server-latest GitHub Release
    needs: [build-linux, build-windows, smoke-test-macos-arm64, build-macos-x64, smoke-test-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-linux-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-windows-x64.exe
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-macos-arm64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-macos-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-amd64.deb
          path: dist

      - name: Read collab-server version
        id: version
        run: echo "version=$(node -p "require('./packages/collab-server/package.json').version")" >> "$GITHUB_OUTPUT"

      # A rolling tag: moved to point at whatever commit this run built
      # from. Not required for the download URLs to work (those only care
      # about the tag *name* + asset filename, not what commit the tag
      # points at) but keeps the release's displayed "Target" accurate.
      - name: Move the rolling collab-server-latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f collab-server-latest
          git push origin collab-server-latest --force

      # Updates the existing release in place (creates it on the very
      # first run) — no delete-and-recreate dance, so the old
      # stale-tag-on-recreate gotcha doesn't apply here.
      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: collab-server-latest
          name: "collab-server v${{ steps.version.outputs.version }}"
          body: |
            Self-hosted real-time collaboration server for Electronic Catalog Maker.

            - `ecm-collab-server-windows-x64.exe` — Windows, portable, no installer
            - `ecm-collab-server-linux-x64` — Linux, portable, no installer
            - `ecm-collab-server-amd64.deb` — Debian/Ubuntu/Chromebook (Linux/Crostini), installable package
            - `ecm-collab-server-macos-arm64.zip` — macOS, Apple Silicon, portable, no installer
            - `ecm-collab-server-macos-x64.zip` — macOS, Intel, portable, no installer

            Ubuntu users can instead install from the
            [Snap Store](https://snapcraft.io/ecm-collab-server) (`sudo snap install ecm-collab-server`).

            On a Chromebook, [turn on Linux (Crostini)](https://support.google.com/chromebook/answer/9145439?hl=en) once in Settings, then download the `.deb` file and double-click it in the Files app — ChromeOS offers to install it, and afterward it shows up as "ECM Collaboration Server" in the Linux apps folder of your app launcher.

            None of these are code-signed. Windows will show a SmartScreen warning on first run ("More info" → "Run anyway").

            The macOS download is a zip (unzipping restores the file's execute permission, which a direct download can't carry) — after unzipping, macOS will refuse to run it at all ("is damaged and can't be opened") because it's fully unsigned; open Terminal in the folder you unzipped it to and run:
            `xattr -d com.apple.quarantine ecm-collab-server-macos-*  &&
            chmod +x ecm-collab-server-macos-* && ./ecm-collab-server-macos-*`
            (replace the `*` with your actual filename) — also requires
            **macOS 13 (Ventura) or later**.

            See [packages/collab-server](https://github.com/alexandrkotov/electronic-catalog-maker/tree/main/packages/collab-server) for details.
          files: |
            dist/ecm-collab-server-linux-x64
            dist/ecm-collab-server-windows-x64.exe
            dist/ecm-collab-server-amd64.deb
            dist/ecm-collab-server-macos-arm64.zip
            dist/ecm-collab-server-macos-x64.zip

  gitlab-binaries:
    name: Back up binaries to GitLab (disaster recovery, not linked from the site)
    needs: [build-linux, build-windows, smoke-test-macos-arm64, build-macos-x64, smoke-test-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-linux-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-windows-x64.exe
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-macos-arm64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-macos-x64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ecm-collab-server-amd64.deb
          path: dist

      # These GitHub Release binaries are the only copies of collab-server
      # end users can download — unlike the source (mirror.yml), they were
      # never covered by the GitLab disaster-recovery setup. This job
      # closes that gap by copying the same 4 files to GitLab's generic
      # package registry on the same mirror project. Deliberately NOT
      # linked from landing/index.html — the public download links stay on
      # GitHub Releases (it just works, has a real CDN, no reason to move
      # normal users off it). These GitLab copies exist purely so the
      # recovery runbook has somewhere to point the download links during
      # an actual "GitHub account/repo is gone" recovery, mirroring how
      # the runbook already repoints the landing page itself.
      #
      # One-time setup (not done by this workflow): repo secret
      # GITLAB_API_TOKEN — a GitLab personal or project access token
      # scoped to `api` (package registry uploads need this; the
      # write_repository-scoped GITLAB_MIRROR_URL token from mirror.yml
      # can't do it). Create it on the same GitLab project as the mirror
      # (gitlab.com/alexkotovwa/electronic-catalog-maker), then:
      #   gh secret set GITLAB_API_TOKEN --repo alexandrkotov/electronic-catalog-maker
      - name: Upload binaries to GitLab's generic package registry
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
        run: |
          if [ -z "$GITLAB_API_TOKEN" ]; then
            echo "::warning::GITLAB_API_TOKEN secret is not set — skipping GitLab binary backup. See the setup notes in this job's header comment."
            exit 0
          fi
          REGISTRY="https://gitlab.com/api/v4/projects/alexkotovwa%2Felectronic-catalog-maker/packages/generic/collab-server/latest"
          for f in dist/*; do
            name=$(basename "$f")
            echo "Uploading $name..."
            curl --fail -sS --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" --upload-file "$f" "$REGISTRY/$name"
          done
