<title id="title">Типы каталогов в четырёх уровнях. Навигация: одна картинка, список картинок или главная картинка. Картинка: одна позиция, фото с точками, разнесённая схема или плитки. Описание: таблица или карточка. Действие: купить, узнать больше, упражнение, записаться, ответить или без действия. Ниже — восемь живых демо и то, что в них выбрано на каждом уровне.</title>
